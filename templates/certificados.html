<!-- ================== CERTIFICADOS ================== -->

<section class="certificados" id="certificados">
  <!-- Título de sección -->
  <div class="secctitulo-certificados">
    <h2
      class="titulo-seccion"
      data-es="Certificados"
      data-en="Certificates"
    ></h2>
    <div class="linea-gradiente"></div>
  </div>

  <!-- ── GRUPO 1 : Diseño Web ── -->
  <div class="cert-grupo" data-grupo="0">
    <div class="cert-grupo__header">
      <div class="marco-subtitulo-cert">
        <span
          class="titulo-grupo-cert"
          data-es="Certificados de Diseño Web"
          data-en="Web Design Certificates"
        ></span>
        <i class="sq tl"></i><i class="sq tr"></i><i class="sq bl"></i
        ><i class="sq br"></i>
      </div>
    </div>
    <div class="cert-scroll" id="slider-cert-0">
      <article
        class="cert-card"
        data-modal-src="images/certificados/platzi-curso_frontend_developer.webp"
        data-modal-alt="Frontend Developer Certificate"
      >
        <div class="cert-capsule">
          <span class="soft-num-cert">1</span>
          <img
            src="images/certificados/platzi-curso_frontend_developer.webp"
            alt="Frontend Developer Certificate"
            loading="lazy"
          />
          <button
            class="cert-ver-btn"
            aria-label="Ver certificado completo"
          ></button>
        </div>
      </article>
      <article
        class="cert-card"
        data-modal-src="images/certificados/diploma-animaciones-css-practico.webp"
        data-modal-alt="CSS Animations Certificate"
      >
        <div class="cert-capsule">
          <span class="soft-num-cert">2</span>
          <img
            src="images/certificados/diploma-animaciones-css-practico.webp"
            alt="CSS Animations Certificate"
            loading="lazy"
          />
          <button
            class="cert-ver-btn"
            aria-label="Ver certificado completo"
          ></button>
        </div>
      </article>
    </div>
    <div class="skills-cert">
      <button
        class="scroll-cert"
        data-target="slider-cert-0"
        data-dir="-1"
        aria-label="Retroceder"
      ></button>
      <button
        class="scroll-cert"
        data-target="slider-cert-0"
        data-dir="1"
        aria-label="Avanzar"
      ></button>
    </div>
  </div>

    </div>
    <div class="skills-cert">

<!-- indicador página -->
<div class="indicador-parallax">
  <div class="linea"><div class="circulo"></div></div>
  <div class="anio">2026</div>
</div>

<!-- ================== MODAL CERTIFICADO ================== -->
<div
  class="cert-modal"
  id="cert-modal"
  role="dialog"
  aria-modal="true"
  aria-label="Ver certificado"
>
  <div class="cert-modal__backdrop"></div>
  <div class="cert-modal__box">
    <button class="cert-modal__close" aria-label="Cerrar"></button>
    <button
      class="cert-modal__nav cert-modal__nav--prev"
      aria-label="Anterior"
    ></button>
    <button
      class="cert-modal__nav cert-modal__nav--next"
      aria-label="Siguiente"
    ></button>
    <div class="cert-modal__img-wrap">
      <img class="cert-modal__img" src="" alt="" />
    </div>
    <div class="cert-modal__counter">
      <span class="cert-modal__counter-cur">1</span>
      <span class="cert-modal__counter-sep">/</span>
      <span class="cert-modal__counter-tot">1</span>
    </div>
  </div>
</div>
